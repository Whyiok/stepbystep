{% extends "base.html" %}
{% set active_page = 'create' %}

{% block title %}Создать инструкцию - StepByStep{% endblock %}

{% block content %}
    <main class="container create-instruction">
        <h1 style="margin-bottom: 2rem; font-size: 2.5rem;">Создать новую инструкцию</h1>
        
        <form id="createForm">
            <div class="form-group">
                <label for="title"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-type"></use></svg> Название инструкции</label>
                <input type="text" id="title" placeholder="Например: Как собрать ПК" maxlength="120" required>
            </div>
            
            <div class="form-group">
                <label for="category"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-folder"></use></svg> Категория</label>
                <select id="category" required>
                    <option value="">Выберите категорию</option>
                    <option value="tech">Технологии</option>
                    <option value="study">Учеба</option>
                    <option value="diy">DIY</option>
                    <option value="office">Офис</option>
                    <option value="cooking">Кулинария</option>
                    <option value="health">Здоровье</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="description"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-left"></use></svg> Описание</label>
                <textarea id="description" placeholder="Краткое описание инструкции..." maxlength="700" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="time"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-clock"></use></svg> Время выполнения (минут)</label>
                <input type="number" id="time" placeholder="45" min="1" required>
            </div>
            
            <div class="form-group">
                <label for="difficulty"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-signal"></use></svg> Сложность</label>
                <select id="difficulty" required>
                    <option value="Лёгкая">Лёгкая</option>
                    <option value="Средняя" selected>Средняя</option>
                    <option value="Сложная">Сложная</option>
                </select>
            </div>
            
            <h2 style="margin: 3rem 0 1.5rem 0;"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-list-ordered"></use></svg> Шаги инструкции</h2>
            
            <div id="stepsContainer" class="steps-container">
                <!-- Шаги будут добавляться здесь -->
            </div>
            
            <button type="button" id="addStepBtn" class="add-step-btn">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-plus"></use></svg> Добавить шаг
            </button>
            
            <div style="margin-top: 3rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-check"></use></svg> Создать инструкцию
                </button>
                <button type="button" class="btn btn-outline" onclick="window.location.href='index.html'">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg> Отмена
                </button>
            </div>
        </form>
    </main>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('asset', folder='js', filename='create.js') }}"></script>
{% endblock %}
